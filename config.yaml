name: "E-Paper Renderer"
description: "Serwer PNG dla wyświetlaczy e-ink (Waveshare 7.5\"). Generuje kalendarz HA, odliczanie dni do daty i statystyki KubeSavings."
version: "1.1.0"
slug: "epaper_renderer"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7

ports:
  5000/tcp: 5000
ports_description:
  5000/tcp: "HTTP API (PNG endpoints)"

options:
  ha_url: "http://homeassistant.local:8123"
  ha_token: ""
  calendars:
    - "calendar.praca"
    - "calendar.igi"
    - "calendar.swieta_w_polsce"
  # Backend KubeSavings + Personal Access Token superusera (ks_pat_...).
  # Puste = endpoint /kubesavings.png pokaże ekran "Brak danych".
  kubesavings_url: ""
  kubesavings_token: ""

schema:
  ha_url: str
  ha_token: str
  calendars:
    - str
  kubesavings_url: str
  kubesavings_token: password

map:
  - config:rw

startup: application
